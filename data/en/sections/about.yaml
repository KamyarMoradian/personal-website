# a summary about you
summary: "
I am a recent graduate from the Iran University of Science and Technology (IUST), where I earned my B.Sc. in Computer Engineering with a passion for tackling complex challenges in machine learning and computer vision. My academic journey has been driven by a deep curiosity and a love for solving what I call \"big problems.\" <br><br>
This passion was truly ignited during my undergraduate thesis on object insertion using diffusion models. Discovering this fascinating and rapidly evolving field felt like finding a new frontier. It presented a steep learning curve that I embraced, reinforcing my belief that challenging problems are the greatest catalysts for growth. This experience set me on my current research path, where I aim to not only understand and apply these powerful models but also to contribute to their advancement. <br><br>
As a research assistant at IUST's CV Lab, I put this philosophy into practice by developing a novel, training-free framework for object removal and insertion in indoor scenes. This work achieved excellent results by specifically addressing key challenges in generative AI, such as high computational costs and data scarcity. I am currently preparing a first-author manuscript detailing these findings for publication. <br><br>
Looking ahead, I am excited to begin my graduate studies and continue my exploration of machine learning's fascinating realm. While my core experience is in computer vision, I am particularly fascinated by the synergy between different AI domains. I am eager to tackle challenges in advanced generative modeling, from 2D and 3D vision to video processing. Furthermore, I am deeply interested in the intersection of vision and language —exploring how machines can understand visual data, and even how these multimodal models can be used to automate the complex, human-centric evaluation of generative vision tasks. 
"

