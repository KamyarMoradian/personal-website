- name: Memory Hierarchy Simulation with Multi-Level Cache
  role: Computer Architecture Course Project
  timeline: "Spring 2022"
  repo: https://github.com/KamyarMoradian/CompilerProject-CodeConverter
  summary: Designed and implemented a VHDL simulation of a memory hierarchy featuring a multi-level cache. The system was driven by a simplified CPU model responsible for fetching and executing instructions, generating realistic memory access patterns to validate the cache's performance.
