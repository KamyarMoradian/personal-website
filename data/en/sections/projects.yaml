- name: Sudoku CSP Solver
  role: Artificical Intelligence Course Assignment Project
  timeline: "Spring 2022"
  repo: https://github.com/KamyarMoradian/AI-CSP-Sudoku
  summary: Implemented and benchmarked multiple Constraint Satisfaction Problem (CSP) algorithms within a Sudoku solver. This project compares a standard backtracking approach against versions enhanced with Arc Consistency (AC-3) and the Minimum Remaining Values (MRV) heuristic. Each algorithm was evaluated on puzzles of varying difficulty by measuring execution time and the number of nodes expanded.
  tags: ["Artificial Intelligence", "Constraint Satisfaction Problems (CSP)", "Algorithm Benchmarking", "Backtracking Search", "Constraint Propagation", "Arc Consistency (AC-3)", "Minimum Remaining Values (MRV)", "Heuristics", "State-Space Search", "Python"]

- name: Tic-Tac-Toe MCST Solver
  role: Artificical Intelligence Course Assignment Project
  timeline: "Spring 2022"
  repo: https://github.com/KamyarMoradian/AI-MCST-Tic-Tac-Toe
  summary: Developed a Tic-Tac-Toe AI agent using the Monte Carlo Tree Search (MCTS) algorithm. The agent builds a search tree over thousands of iterations; each iteration involves a process of UCB1-based selection, node expansion, random simulation, and backpropagation of results. The project includes a playable game loop for a human vs. AI match and a suite of unit tests to verify the agent's logic.
  tags: ["Artificial Intelligence", "Game AI", "Game Theory", "RL", "MCTS", "Tree Search Algorithms", "Game Tree", "Python", "Unit Testing"]

- name: NQueen Hillclimbing Solver
  role: Artificical Intelligence Course Assignment Project
  timeline: "Spring 2022"
  repo: https://github.com/KamyarMoradian/HillClimbing-NQueen
  summary: Implemented a solution for the N-Queens problem using the Hill Climbing with Random Restart algorithm. The solver applies local search, starting from a random board state, to iteratively minimize the number of queen conflicts based on a heuristic function. A random-restart mechanism is integrated to escape local minima, with the solver's performance benchmarked by its success rate and execution time over multiple trials.
  tags: ["Artificial Intelligence", "Local Search", "Hill Climbing", "Random-Restart Hill Climbing", "Heuristic Function", "State-Space Search", "Python"]
